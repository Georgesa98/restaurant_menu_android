name: restaurant_menu_android
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cached_network_image: ^4.0.0
  connectivity_plus: ^7.3.1
  dio: ^5.11.1
  drift: ^2.34.4
  flutter_cache_manager: ^3.4.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.0.0
  go_router: ^18.0.1
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: ^0.6.0+eol
  uuid: ^4.6.0
  wakelock_plus: ^1.8.0
  workmanager: ^0.10.10
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.6
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  assets:
    - assets/tenants/demo/theme.json
    - assets/tenants/valley-star/theme.json

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
